services:
  webapp:
    image: rise-gent-gr08
    container_name: rise8-webapp
    restart: always
    ports:
      - "80:8080"
    networks:
      - app-network
    volumes:
      - ./appsettings.json:/App/appsettings.json
      - /tmp/app-logs/:/App/logs/

networks:
  app-network:
    driver: bridge

volumes:
  rise_data:
  app-logs:
